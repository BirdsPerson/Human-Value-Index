# Netlify configuration for Lattice as a standalone site.
# Valid once lattice/ is the repository root (after extraction).

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: every route serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
