name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  human-value-index:
    name: Human Value Index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  lattice:
    name: Lattice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lattice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lattice/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
